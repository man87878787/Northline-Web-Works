<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Budget</title><style>body{background:#eff3fa;color:#16243b;font:16px system-ui;margin:0}main{max-width:740px;margin:32px auto;padding:20px}.card{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 18px #001a371a}label{display:block;font-weight:600;margin:15px 0}input,textarea{width:100%;box-sizing:border-box;font:inherit;border:1px solid #b9c5d4;border-radius:8px;margin-top:6px;padding:11px}button{padding:12px 18px;color:white;background:#145dbb;border:0;border-radius:8px;cursor:pointer}a{color:#1354a8}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;padding:16px;border-radius:8px}</style></head><body><main><a href="../../index.html">← Browse 100 projects</a><section class="card"><h1>Monthly Budget</h1><p>Track budget left after listed monthly expenses.</p><label>Monthly budget<input id="f0" type="number" value="900"></label><label>Expenses (one amount per line)<textarea id="f1" rows="5">150
250
85</textarea></label><button id="run">Calculate</button> <button id="copy">Copy result</button><h2>Result</h2><pre id="out" aria-live="polite"></pre><p>Offline-first: this app never sends your input to a server. All results are illustrative estimates.</p></section></main><script>const N=(v,i)=>{const n=Number(v[i]);if(!Number.isFinite(n))throw Error("Enter a valid number");return n};const T=(v,i)=>String(v[i]??"");const F=(n,d=2)=>Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"Undefined";const M=(n)=>"$"+F(n);const compute=v=>{const n=T(v,1).split(/[\s,]+/).filter(Boolean).map(Number);if(n.some(x=>!Number.isFinite(x)))return "Use numbers only in expenses.";const used=n.reduce((x,y)=>x+y,0);return `Spent: ${M(used)}\nRemaining: ${M(N(v,0)-used)}`};const ids=["f0","f1"];function run(){try{document.getElementById("out").textContent=String(compute(ids.map(x=>document.getElementById(x).value)))}catch(e){document.getElementById("out").textContent="Error: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("out").textContent);run();</script></body></html>
