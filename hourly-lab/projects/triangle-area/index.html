<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triangle Area</title><style>body{font:16px system-ui;background:#edf2f9;color:#16243b;margin:0}main{max-width:740px;margin:28px auto;padding:20px}.card{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 22px #152b4818}a{color:#1459af}label{display:block;font-weight:600;margin:16px 0}input,textarea{font:inherit;box-sizing:border-box;display:block;width:100%;border:1px solid #b2c0d1;border-radius:8px;padding:12px;margin-top:7px}button{background:#135db8;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fc;padding:16px;border-radius:8px;min-height:30px}</style></head><body><main><a href="../../index.html">← Browse all projects</a><section class="card"><h1>Triangle Area</h1><p>Calculate triangle area from base and perpendicular height.</p><label>Base<input id="f0" type="number" value="9"></label><label>Height<input id="f1" type="number" value="6"></label><button id="run">Calculate</button> <button id="copy">Copy</button><h2>Result</h2><pre id="output" aria-live="polite"></pre><p>Offline calculator. Check results independently for critical applications.</p></section></main><script>const N=(v,i)=>{const n=Number(v[i]);if(!Number.isFinite(n))throw Error("Invalid numeric input");return n};const T=(v,i)=>String(v[i]??"");const F=(x,d=4)=>Number.isFinite(x)?Number(x.toFixed(d)).toLocaleString("en-US"):"Undefined";const compute=v=>N(v,0)>=0&&N(v,1)>=0?`Area: ${F(N(v,0)*N(v,1)/2)}`:"Dimensions must be nonnegative.";const ids=["f0","f1"];function run(){try{document.getElementById("output").textContent=String(compute(ids.map(x=>document.getElementById(x).value)))}catch(e){document.getElementById("output").textContent="Error: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("output").textContent);run();</script></body></html>
