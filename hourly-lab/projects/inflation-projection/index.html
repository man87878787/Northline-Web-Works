<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inflation Projection</title><style>body{background:#eff3fa;color:#16243b;font:16px system-ui;margin:0}main{max-width:740px;margin:32px auto;padding:20px}.card{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 18px #001a371a}label{display:block;font-weight:600;margin:15px 0}input,textarea{width:100%;box-sizing:border-box;font:inherit;border:1px solid #b9c5d4;border-radius:8px;margin-top:6px;padding:11px}button{padding:12px 18px;color:white;background:#145dbb;border:0;border-radius:8px;cursor:pointer}a{color:#1354a8}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;padding:16px;border-radius:8px}</style></head><body><main><a href="../../index.html">← Browse 100 projects</a><section class="card"><h1>Inflation Projection</h1><p>Estimate a future price under steady assumed inflation.</p><label>Price today<input id="f0" type="number" value="100"></label><label>Assumed annual inflation %<input id="f1" type="number" value="3"></label><label>Years ahead<input id="f2" type="number" value="5"></label><button id="run">Calculate</button> <button id="copy">Copy result</button><h2>Result</h2><pre id="out" aria-live="polite"></pre><p>Offline-first: this app never sends your input to a server. All results are illustrative estimates.</p></section></main><script>const N=(v,i)=>{const n=Number(v[i]);if(!Number.isFinite(n))throw Error("Enter a valid number");return n};const T=(v,i)=>String(v[i]??"");const F=(n,d=2)=>Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"Undefined";const M=(n)=>"$"+F(n);const compute=v=>`Projected price: ${M(N(v,0)*Math.pow(1+N(v,1)/100,N(v,2)))}`;const ids=["f0","f1","f2"];function run(){try{document.getElementById("out").textContent=String(compute(ids.map(x=>document.getElementById(x).value)))}catch(e){document.getElementById("out").textContent="Error: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("out").textContent);run();</script></body></html>
