<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mean Median Mode</title><style>body{font:16px system-ui;background:#edf2f9;color:#16243b;margin:0}main{max-width:740px;margin:28px auto;padding:20px}.card{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 22px #152b4818}a{color:#1459af}label{display:block;font-weight:600;margin:16px 0}input,textarea{font:inherit;box-sizing:border-box;display:block;width:100%;border:1px solid #b2c0d1;border-radius:8px;padding:12px;margin-top:7px}button{background:#135db8;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fc;padding:16px;border-radius:8px;min-height:30px}</style></head><body><main><a href="../../index.html">← Browse all projects</a><section class="card"><h1>Mean Median Mode</h1><p>Compute common summary statistics on a dataset.</p><label>Numbers, comma- or space-separated<textarea id="f0" rows="5">2, 4, 4, 5, 10</textarea></label><button id="run">Calculate</button> <button id="copy">Copy</button><h2>Result</h2><pre id="output" aria-live="polite"></pre><p>Offline calculator. Check results independently for critical applications.</p></section></main><script>const N=(v,i)=>{const n=Number(v[i]);if(!Number.isFinite(n))throw Error("Invalid numeric input");return n};const T=(v,i)=>String(v[i]??"");const F=(x,d=4)=>Number.isFinite(x)?Number(x.toFixed(d)).toLocaleString("en-US"):"Undefined";const compute=v=>{let n=T(v,0).split(/[\s,]+/).filter(Boolean).map(Number);if(!n.length||n.some(x=>!Number.isFinite(x)))return "Enter at least one valid number.";n.sort((a,b)=>a-b);const mean=n.reduce((s,x)=>s+x,0)/n.length,med=n.length%2?n[(n.length-1)/2]:(n[n.length/2-1]+n[n.length/2])/2,map=new Map();for(const x of n)map.set(x,(map.get(x)||0)+1);const max=Math.max(...map.values()),modes=[...map].filter(x=>x[1]===max).map(x=>x[0]);return `Count: ${n.length}\nMean: ${F(mean)}\nMedian: ${F(med)}\nMode: ${max===1?"none":modes.join(", ")}`};const ids=["f0"];function run(){try{document.getElementById("output").textContent=String(compute(ids.map(x=>document.getElementById(x).value)))}catch(e){document.getElementById("output").textContent="Error: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("output").textContent);run();</script></body></html>
