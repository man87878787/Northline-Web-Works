<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Difference</title><style>body{font:16px system-ui;background:#eef3fa;color:#18243b;margin:0}main{max-width:740px;margin:30px auto;padding:22px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 30px #17294418}a{color:#155cb8}label{font-weight:600;display:block;margin:15px 0}input,textarea{box-sizing:border-box;width:100%;font:inherit;display:block;padding:12px;margin-top:6px;border:1px solid #b2bfce;border-radius:8px}button{color:white;background:#1158ba;border:0;border-radius:8px;padding:12px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;padding:16px;border-radius:8px;min-height:35px}</style></head><body><main><a href="../../index.html">← All projects</a><div class="card"><h1>Date Difference</h1><p>Count calendar days between two dates.</p><label>Start YYYY-MM-DD<input id="i0" type="text" value="2026-01-01"></label><label>End YYYY-MM-DD<input id="i1" type="text" value="2026-02-15"></label><button id="run">Run tool</button> <button id="copy">Copy result</button><h2>Output</h2><pre id="out" aria-live="polite"></pre><p>All processing is performed locally in your browser.</p></div></main><script>const N=(v,i)=>{const x=Number(v[i]);if(!Number.isFinite(x))throw Error("Enter a valid number");return x};const T=(v,i)=>String(v[i]??"");const L=(v,i)=>T(v,i).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const F=(n,d=2)=>Number.isFinite(n)?Number(n.toFixed(d)).toLocaleString("en-US"):"Undefined";function compute(v){let p=s=>{let d=new Date(s+"T00:00:00Z");if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||isNaN(d)||d.toISOString().slice(0,10)!==s)throw Error("Invalid date");return d.getTime()};return ((p(T(v,1))-p(T(v,0)))/86400000)+" calendar days";}const ids=["i0","i1"];function run(){try{document.getElementById("out").textContent=String(compute(ids.map(x=>document.getElementById(x).value)))}catch(e){document.getElementById("out").textContent="Error: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("out").textContent);run();</script></body></html>
