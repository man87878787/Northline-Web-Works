<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UTC Offset Converter</title><style>body{font:16px system-ui;background:#eef3fa;color:#18243b;margin:0}main{max-width:740px;margin:30px auto;padding:22px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 30px #17294418}a{color:#155cb8}label{font-weight:600;display:block;margin:15px 0}input,textarea{box-sizing:border-box;width:100%;font:inherit;display:block;padding:12px;margin-top:6px;border:1px solid #b2bfce;border-radius:8px}button{color:white;background:#1158ba;border:0;border-radius:8px;padding:12px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;padding:16px;border-radius:8px;min-height:35px}</style></head><body><main><a href="../../index.html">← All projects</a><div class="card"><h1>UTC Offset Converter</h1><p>Convert UTC clock time to a fixed numeric UTC offset; excludes DST.</p><label>UTC hour<input id="i0" type="number" value="18"></label><label>UTC minute<input id="i1" type="number" value="30"></label><label>UTC offset hours<input id="i2" type="number" value="-4"></label><button id="run">Run tool</button> <button id="copy">Copy result</button><h2>Output</h2><pre id="out" aria-live="polite"></pre><p>All processing is performed locally in your browser.</p></div></main><script>const N=(v,i)=>{const x=Number(v[i]);if(!Number.isFinite(x))throw Error("Enter a valid number");return x};const T=(v,i)=>String(v[i]??"");const L=(v,i)=>T(v,i).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const F=(n,d=2)=>Number.isFinite(n)?Number(n.toFixed(d)).toLocaleString("en-US"):"Undefined";function compute(v){let h=N(v,0),m=N(v,1),o=N(v,2);if(!Number.isInteger(h)||h<0||h>23||!Number.isInteger(m)||m<0||m>59||!Number.isInteger(o*60))return "Invalid time or offset";let z=h*60+m+o*60,d=Math.floor(z/1440),r=(z%1440+1440)%1440;return String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")+" day offset "+d;}const ids=["i0","i1","i2"];function run(){try{document.getElementById("out").textContent=String(compute(ids.map(x=>document.getElementById(x).value)))}catch(e){document.getElementById("out").textContent="Error: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("out").textContent);run();</script></body></html>
