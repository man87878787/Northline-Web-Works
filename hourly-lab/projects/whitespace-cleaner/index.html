<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whitespace Cleaner</title><style>body{font:16px system-ui;background:#eef2f8;color:#15203a;margin:0}main{max-width:760px;margin:36px auto;padding:20px}.card{background:white;border-radius:16px;padding:26px;box-shadow:0 5px 25px #15203a18}a{color:#125abb}label{display:block;margin:16px 0;font-weight:600}input,textarea{font:inherit;box-sizing:border-box;width:100%;display:block;padding:12px;margin-top:7px;border-radius:8px;border:1px solid #aab7cc;background:white;color:#15203a}button{padding:12px;border:0;border-radius:8px;background:#125abb;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;border-radius:8px;background:#f6f8fa;min-height:40px}</style><main><a href="../../index.html">← Browse all projects</a><div class="card"><h1>Whitespace Cleaner</h1><p>Collapse extra spaces and blank lines. All processing happens locally in this browser.</p><label>Text<textarea id="f0" rows="5"> hello    world 


 second   line </textarea></label><button id="run">Run tool</button> <button id="copy">Copy result</button><h2>Output</h2><pre id="out" aria-live="polite"></pre></div></main><script>const N=(v,i)=>{let x=Number(v[i]);return Number.isFinite(x)?x:0};const T=(v,i)=>String(v[i]??"");const L=(v,i)=>T(v,i).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const F=(x,d=2)=>Number.isFinite(x)?Number(x.toFixed(d)).toLocaleString("en-US"):"Invalid";const compute=v=>T(v,0).split("\n").map(x=>x.trim().replace(/\s+/g," ")).join("\n").replace(/\n{3,}/g,"\n\n").trim();const ids=["f0"];function run(){try{document.getElementById("out").textContent=String(compute(ids.map(x=>document.getElementById(x).value)))}catch(e){document.getElementById("out").textContent="Error: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("out").textContent);run();</script></html>
