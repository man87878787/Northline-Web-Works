<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Contrast Checker</title><style>body{font:16px system-ui;background:#eef2f8;color:#15203a;margin:0}main{max-width:760px;margin:36px auto;padding:20px}.card{background:white;border-radius:16px;padding:26px;box-shadow:0 5px 25px #15203a18}a{color:#125abb}label{display:block;margin:16px 0;font-weight:600}input,textarea{font:inherit;box-sizing:border-box;width:100%;display:block;padding:12px;margin-top:7px;border-radius:8px;border:1px solid #aab7cc;background:white;color:#15203a}button{padding:12px;border:0;border-radius:8px;background:#125abb;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;border-radius:8px;background:#f6f8fa;min-height:40px}</style><main><a href="../../index.html">← Browse all projects</a><div class="card"><h1>Color Contrast Checker</h1><p>Check WCAG text color contrast ratio. All processing happens locally in this browser.</p><label>Foreground<input id="f0" type="text" value="#111827"></label>
<label>Background<input id="f1" type="text" value="#ffffff"></label><button id="run">Run tool</button> <button id="copy">Copy result</button><h2>Output</h2><pre id="out" aria-live="polite"></pre></div></main><script>const N=(v,i)=>{let x=Number(v[i]);return Number.isFinite(x)?x:0};const T=(v,i)=>String(v[i]??"");const L=(v,i)=>T(v,i).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const F=(x,d=2)=>Number.isFinite(x)?Number(x.toFixed(d)).toLocaleString("en-US"):"Invalid";const compute=v=>{const l=s=>{let h=s.replace("#","");if(!/^[a-f0-9]{6}$/i.test(h))throw Error("Use six-digit hex colors");let c=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722};try{let x=l(T(v,0)),y=l(T(v,1)),r=(Math.max(x,y)+.05)/(Math.min(x,y)+.05);return `${F(r)}:1 | AA normal ${r>=4.5?"PASS":"FAIL"} | AAA normal ${r>=7?"PASS":"FAIL"}`}catch(e){return e.message}};const ids=["f0","f1"];function run(){try{document.getElementById("out").textContent=String(compute(ids.map(x=>document.getElementById(x).value)))}catch(e){document.getElementById("out").textContent="Error: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("out").textContent);run();</script></html>
